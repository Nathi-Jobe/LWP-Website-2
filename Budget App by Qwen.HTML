<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Money Trajectory - Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICONS (Inline SVGs for zero-dependency preview) ---
        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>
        );
        const Shield = (p) => <Icon {...p} path={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></>} />;
        const Lock = (p) => <Icon {...p} path={<><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>} />;
        const TrendingUp = (p) => <Icon {...p} path={<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>} />;
        const Plus = (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />;
        const Minus = (p) => <Icon {...p} path={<><line x1="5" y1="12" x2="19" y2="12"/></>} />;
        const CheckCircle = (p) => <Icon {...p} path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />;
        const AlertCircle = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />;
        const Upload = (p) => <Icon {...p} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>} />;

        // --- APP COMPONENTS ---

        const PinScreen = ({ onUnlock }) => {
            const [pin, setPin] = useState('');
            const handleSubmit = (e) => {
                e.preventDefault();
                if (pin.length >= 4) onUnlock(pin);
            };
            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4 fade-in">
                    <div className="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full space-y-6 border border-gray-100">
                        <div className="text-center">
                            <div className="bg-blue-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                <Lock className="w-8 h-8 text-blue-600" />
                            </div>
                            <h2 className="text-2xl font-bold text-gray-900">Enter your PIN</h2>
                            <p className="text-sm text-gray-500 mt-2">Your data is encrypted and private.</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input
                                type="password" inputMode="numeric" maxLength={6} value={pin}
                                onChange={(e) => setPin(e.target.value)}
                                className="w-full text-center text-3xl tracking-widest border-2 border-gray-200 rounded-xl p-4 focus:border-blue-500 focus:outline-none transition"
                                placeholder="• • • •" autoFocus
                            />
                            <button type="submit" className="w-full bg-blue-600 text-white py-4 rounded-xl font-semibold text-lg hover:bg-blue-700 transition active:scale-95 shadow-md">
                                Unlock
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ onNavigate, transactions }) => {
            const chartData = useMemo(() => {
                let cumulative = 0;
                return Array.from({ length: 12 }, (_, i) => {
                    cumulative += 3000 + (Math.random() * 500); 
                    return { month: `M${i+1}`, val: cumulative };
                });
            }, []);

            const maxVal = Math.max(...chartData.map(d => d.val));

            return (
                <div className="max-w-4xl mx-auto p-4 space-y-6 fade-in pb-24">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm">
                            <div className="text-xs font-medium text-gray-500 uppercase tracking-wide">Avg Income</div>
                            <div className="text-2xl font-bold text-green-600 mt-1">R25,000</div>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm">
                            <div className="text-xs font-medium text-gray-500 uppercase tracking-wide">Avg Expenses</div>
                            <div className="text-2xl font-bold text-red-600 mt-1">R22,000</div>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm">
                            <div className="text-xs font-medium text-gray-500 uppercase tracking-wide">Monthly Surplus</div>
                            <div className="text-2xl font-bold text-blue-600 mt-1">R3,000</div>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="font-bold text-lg text-gray-900">12-Month Trajectory</h3>
                            <span className="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded-full font-medium">Projected</span>
                        </div>
                        
                        {/* CSS Bar Chart for robust preview */}
                        <div className="flex items-end justify-between h-48 gap-2 mt-4 px-2">
                            {chartData.map((d, i) => (
                                <div key={i} className="flex flex-col items-center flex-1 group">
                                    <div className="text-[10px] text-gray-400 mb-1 opacity-0 group-hover:opacity-100 transition">R{Math.round(d.val)}</div>
                                    <div 
                                        className="w-full bg-blue-500 rounded-t-md transition-all duration-500 hover:bg-blue-600 relative"
                                        style={{ height: `${(d.val / maxVal) * 100}%` }}
                                    >
                                        {i === 0 && <div className="absolute top-0 left-0 right-0 h-1 bg-blue-300 rounded-t-md"></div>}
                                    </div>
                                    <div className="text-[10px] text-gray-500 mt-2 font-medium">{d.month}</div>
                                </div>
                            ))}
                        </div>
                        <p className="text-xs text-gray-400 text-center mt-4">
                            *Based on your confirmed historical data. Adjust in the Simulator.
                        </p>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                        <button onClick={() => onNavigate('import')} className="bg-white border-2 border-dashed border-gray-300 text-gray-700 p-6 rounded-2xl font-semibold flex flex-col items-center gap-3 hover:border-blue-500 hover:text-blue-600 transition">
                            <Upload className="w-6 h-6" /> Import Statement
                        </button>
                        <button onClick={() => onNavigate('simulator')} className="bg-blue-600 text-white p-6 rounded-2xl font-semibold flex flex-col items-center gap-3 hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                            <TrendingUp className="w-6 h-6" /> Simulator
                        </button>
                    </div>
                </div>
            );
        };

        const Simulator = ({ onBack }) => {
            const [amount, setAmount] = useState(300);
            return (
                <div className="max-w-md mx-auto p-6 space-y-8 fade-in">
                    <button onClick={onBack} className="text-gray-500 text-sm font-medium hover:text-gray-900">← Back to Dashboard</button>
                    <div>
                        <h2 className="text-2xl font-bold text-gray-900">Small-Change Simulator</h2>
                        <p className="text-gray-500 mt-1">Pick one manageable adjustment.</p>
                    </div>
                    
                    <div className="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm space-y-6">
                        <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-3">Reduce "Takeaways" by:</label>
                            <div className="flex items-center justify-center gap-6">
                                <button onClick={() => setAmount(Math.max(0, amount - 50))} className="w-14 h-14 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 active:scale-95 transition">
                                    <Minus className="w-6 h-6 text-gray-700" />
                                </button>
                                <div className="text-4xl font-bold text-blue-600 w-32 text-center tabular-nums">R{amount}</div>
                                <button onClick={() => setAmount(amount + 50)} className="w-14 h-14 flex items-center justify-center rounded-full bg-blue-100 hover:bg-blue-200 active:scale-95 transition">
                                    <Plus className="w-6 h-6 text-blue-700" />
                                </button>
                            </div>
                        </div>
                        
                        <div className="bg-green-50 border border-green-200 p-4 rounded-xl flex gap-3">
                            <CheckCircle className="w-5 h-5 text-green-600 flex-shrink-0 mt-0.5" />
                            <p className="text-sm text-green-800 leading-relaxed">
                                Over 12 months, this small change adds <strong>R{amount * 12}</strong> to your financial resilience.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [isUnlocked, setIsUnlocked] = useState(false);
            const [view, setView] = useState('dashboard');

            if (!isUnlocked) return <PinScreen onUnlock={() => setIsUnlocked(true)} />;

            return (
                <div className="min-h-screen bg-gray-50">
                    <header className="bg-white border-b border-gray-200 px-4 py-4 flex justify-between items-center sticky top-0 z-10 backdrop-blur-md bg-white/80">
                        <div className="flex items-center gap-2">
                            <div className="bg-blue-600 p-1.5 rounded-lg">
                                <TrendingUp className="w-4 h-4 text-white" />
                            </div>
                            <h1 className="font-bold text-lg tracking-tight">My Money Trajectory</h1>
                        </div>
                        <button onClick={() => setIsUnlocked(false)} className="text-xs text-gray-500 hover:text-red-600 flex items-center gap-1.5 bg-gray-100 px-3 py-1.5 rounded-full transition">
                            <Lock className="w-3 h-3" /> Lock
                        </button>
                    </header>

                    <main>
                        {view === 'dashboard' && <Dashboard onNavigate={setView} />}
                        {view === 'simulator' && <Simulator onBack={() => setView('dashboard')} />}
                        {view === 'import' && (
                            <div className="max-w-md mx-auto p-6 space-y-6 fade-in">
                                <button onClick={() => setView('dashboard')} className="text-gray-500 text-sm font-medium">← Back</button>
                                <h2 className="text-2xl font-bold">Import Statement</h2>
                                <div className="border-2 border-dashed border-gray-300 rounded-2xl p-10 text-center hover:border-blue-500 transition cursor-pointer bg-white">
                                    <Upload className="w-10 h-10 mx-auto text-gray-400 mb-3" />
                                    <p className="text-blue-600 font-semibold">Click to upload CSV</p>
                                    <p className="text-xs text-gray-400 mt-2">Processed locally. PII stripped.</p>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
